<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Password Generator 🔐</h2>

    <label>Password Length</label>
    <input type="number" id="length" min="4" max="20" value="12">

    <div class="options">
        <label><input type="checkbox" id="uppercase" checked> Uppercase Letters</label>
        <label><input type="checkbox" id="lowercase" checked> Lowercase Letters</label>
        <label><input type="checkbox" id="numbers" checked> Numbers</label>
        <label><input type="checkbox" id="symbols"> Special Characters</label>
    </div>

    <button onclick="generatePassword()">Generate Password</button>

    <input type="text" id="result" placeholder="Your password will appear here" readonly>
</div>

<script src="script.js"></script>
</body>
</html>
